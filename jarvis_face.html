<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Jarvis</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #05070c;
      overflow: hidden;
      cursor: none;
    }
    canvas { display: block; width: 100%; height: 100%; }
    #state {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 4vh;
      text-align: center;
      font: 500 1.4vh/1 "Segoe UI", sans-serif;
      letter-spacing: 0.55em;
      text-transform: uppercase;
      color: rgba(255, 214, 120, 0.55);
      pointer-events: none;
    }
    #activity {
      position: fixed;
      left: 8vw;
      right: 8vw;
      bottom: 8vh;
      text-align: center;
      font: 400 1.6vh/1.3 "Segoe UI", sans-serif;
      letter-spacing: 0.08em;
      color: rgba(255, 228, 170, 0.8);
      pointer-events: none;
    }
  </style>
</head>
<body>
  <canvas id="face"></canvas>
  <div id="activity"></div>
  <div id="state">idle</div>
  <script>
    const canvas = document.getElementById("face");
    const ctx = canvas.getContext("2d");
    const label = document.getElementById("state");
    const activity = document.getElementById("activity");
    const targets = {
      idle:         { spin: 0.28, tumble: 0.12, inward: 0, outward: 0,    heat: 0,    spikes: 0, waves: 0 },
      listening:    { spin: 0.7,  tumble: 0.4,  inward: 0, outward: 0.22, heat: 0.2,  spikes: 0, waves: 0.15 },
      transcribing: { spin: 1.05, tumble: 0.55, inward: 0.25, outward: 0, heat: 0.35, spikes: 0, waves: 0 },
      thinking:     { spin: 1.35, tumble: 0.85, inward: 0.55, outward: 0, heat: 1,    spikes: 0, waves: 0 },
      acting:       { spin: 1.7,  tumble: 1.05, inward: 0.1, outward: 0.15, heat: 0.75, spikes: 0.9, waves: 0.2 },
      speaking:     { spin: 0.45, tumble: 0.2,  inward: 0, outward: 0.35, heat: 0.35, spikes: 1, waves: 1 },
      responding:   { spin: 0.45, tumble: 0.2,  inward: 0, outward: 0.35, heat: 0.35, spikes: 1, waves: 1 },
      waiting:      { spin: 0.12, tumble: 0.08, inward: 0.04, outward: 0, heat: 0.08, spikes: 0, waves: 0.45 },
      error:        { spin: 2.2,  tumble: 1.7,  inward: 0.75, outward: 0, heat: 1,    spikes: 0.35, waves: 0 },
      offline:      { spin: 0.02, tumble: 0.02, inward: 0, outward: 0, heat: 0,    spikes: 0, waves: 0 }
    };
    let mode = "idle";
    const live = Object.assign({}, targets.idle);
    const particles = [];
    const waves = [];
    let yaw = 0.6;
    let pitch = 0.35;
    let t = 0;
    let last = performance.now();

    function resize() {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      canvas.width = Math.floor(innerWidth * dpr);
      canvas.height = Math.floor(innerHeight * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    addEventListener("resize", resize);
    resize();

    function seed() {
      particles.length = 0;
      const count = Math.min(640, Math.floor(innerWidth * innerHeight / 1700));
      for (let i = 0; i < count; i++) {
        particles.push({
          th: Math.random() * Math.PI * 2,
          ph: Math.acos(2 * Math.random() - 1),
          r: 0.72 + Math.random() * 0.28,
          speed: 0.25 + Math.random() * 1,
          size: Math.random() < 0.07 ? 2.4 : 0.7 + Math.random() * 1.2,
          shell: Math.random() < 0.25 ? 0.45 : 1
        });
      }
    }
    seed();

    function lerp(a, b, k) { return a + (b - a) * k; }

    function setMode(next) {
      if (!targets[next] || next === mode) return;
      mode = next;
      label.textContent = next;
    }

    function apply(data) {
      if (data && targets[data.state]) setMode(data.state);
      activity.textContent = (data && data.activity) || "";
    }

    async function poll() {
      try {
        const response = await fetch("/state", { cache: "no-store" });
        apply(await response.json());
      } catch (err) {}
    }
    setInterval(poll, 250);
    if (window.EventSource) {
      const events = new EventSource("/events");
      events.onmessage = (event) => {
        try { apply(JSON.parse(event.data)); } catch (err) {}
      };
    }

    addEventListener("keydown", (event) => {
      const key = {
        i: "idle", l: "listening", t: "thinking", a: "acting",
        r: "responding", w: "waiting", e: "error"
      }[event.key.toLowerCase()];
      if (key) setMode(key);
      if (event.key.toLowerCase() === "f") document.documentElement.requestFullscreen?.();
    });

    function project(x, y, z, unit, cx, cy) {
      const dist = 4.1 - z;
      const p = 3.05 / dist;
      return { x: cx + x * p * unit, y: cy + y * p * unit, p, z };
    }

    function turn(x, y, z) {
      const cyaw = Math.cos(yaw);
      const syaw = Math.sin(yaw);
      const x1 = x * cyaw + z * syaw;
      const z1 = -x * syaw + z * cyaw;
      const cp = Math.cos(pitch);
      const sp = Math.sin(pitch);
      const y2 = y * cp - z1 * sp;
      const z2 = y * sp + z1 * cp;
      return [x1, y2, z2];
    }

    function spherePoint(radius, th, ph) {
      return turn(
        radius * Math.sin(ph) * Math.cos(th),
        radius * Math.cos(ph),
        radius * Math.sin(ph) * Math.sin(th)
      );
    }

    function strokeLoop(points, width, alpha) {
      ctx.beginPath();
      ctx.moveTo(points[0].x, points[0].y);
      for (let i = 1; i < points.length; i++) ctx.lineTo(points[i].x, points[i].y);
      ctx.closePath();
      const depth = points.reduce((sum, p) => sum + p.z, 0) / points.length;
      const fade = 0.35 + 0.65 * ((depth + 1) / 2);
      ctx.strokeStyle = `rgba(255, 196, 80, ${alpha * fade})`;
      ctx.lineWidth = width;
      ctx.stroke();
    }

    function frame(ms) {
      const dt = Math.min(0.05, (ms - last) / 1000);
      last = ms;
      t += dt;
      const goal = targets[mode];
      for (const key of Object.keys(live)) live[key] = lerp(live[key], goal[key], 1 - Math.exp(-2.2 * dt));
      yaw += dt * live.spin;
      pitch = 0.42 + Math.sin(t * live.tumble) * (0.18 + live.heat * 0.25);

      const w = innerWidth;
      const h = innerHeight;
      const cx = w * 0.5;
      const cy = h * 0.47;
      const unit = Math.min(w, h) * 0.36;

      ctx.fillStyle = "#05070c";
      ctx.fillRect(0, 0, w, h);
      const room = ctx.createRadialGradient(cx, cy, unit * 0.2, cx, cy, unit * 2.4);
      room.addColorStop(0, `rgba(120, 70, 10, ${0.22 + live.heat * 0.28})`);
      room.addColorStop(1, "rgba(0, 0, 0, 0)");
      ctx.fillStyle = room;
      ctx.fillRect(0, 0, w, h);

      const rings = [];
      for (let i = 0; i < 7; i++) {
        const tilt = (i / 7) * Math.PI;
        const pts = [];
        for (let s = 0; s <= 64; s++) {
          const a = (s / 64) * Math.PI * 2;
          const [x, y, z] = turn(Math.cos(a), Math.sin(a) * Math.cos(tilt), Math.sin(a) * Math.sin(tilt));
          pts.push(project(x * 0.98, y * 0.98, z * 0.98, unit, cx, cy));
        }
        rings.push(pts);
      }
      rings.sort((a, b) => {
        const za = a.reduce((s, p) => s + p.z, 0);
        const zb = b.reduce((s, p) => s + p.z, 0);
        return za - zb;
      });
      for (const pts of rings) strokeLoop(pts, 1.3, 0.28 + live.heat * 0.25);

      if (live.waves > 0.05 && Math.random() < dt * 2.5 * live.waves) waves.push({ born: t });
      for (let i = waves.length - 1; i >= 0; i--) {
        const age = (t - waves[i].born) / 1.8;
        if (age >= 1) {
          waves.splice(i, 1);
          continue;
        }
        const radius = 0.25 + age * 1.15;
        const pts = [];
        for (let s = 0; s <= 56; s++) {
          const a = (s / 56) * Math.PI * 2;
          const [x, y, z] = turn(Math.cos(a) * radius, 0, Math.sin(a) * radius);
          pts.push(project(x, y, z, unit, cx, cy));
        }
        strokeLoop(pts, 2, (1 - age) * 0.7 * live.waves);
      }

      if (live.spikes > 0.2) {
        const bars = 36;
        for (let i = 0; i < bars; i++) {
          const th = (i / bars) * Math.PI * 2 + yaw;
          const ph = Math.PI / 2 + Math.sin(i + t) * 0.35;
          const env = 0.25 + 0.75 * Math.abs(Math.sin(t * 6 + i));
          const r0 = 0.78;
          const r1 = r0 + 0.28 * env * live.spikes;
          const a = spherePoint(r0, th, ph);
          const b = spherePoint(r1, th, ph);
          const p0 = project(a[0], a[1], a[2], unit, cx, cy);
          const p1 = project(b[0], b[1], b[2], unit, cx, cy);
          ctx.beginPath();
          ctx.moveTo(p0.x, p0.y);
          ctx.lineTo(p1.x, p1.y);
          ctx.strokeStyle = `rgba(255, 220, 140, ${0.35 + env * 0.5})`;
          ctx.lineWidth = 2;
          ctx.stroke();
        }
      }

      const dots = [];
      for (const p of particles) {
        p.th += dt * p.speed * (0.15 + live.spin * 0.35) * (p.shell < 1 ? -1 : 1);
        p.r -= dt * live.inward * 0.45;
        p.r += dt * live.outward * 0.22;
        if (p.r < 0.12) p.r = 0.95 + Math.random() * 0.1;
        if (p.r > 1.25) p.r = 0.55 + Math.random() * 0.15;
        const radius = p.r * p.shell;
        const pos = spherePoint(radius, p.th, p.ph);
        const projected = project(pos[0], pos[1], pos[2], unit, cx, cy);
        projected.size = p.size * projected.p;
        projected.hot = p.r < 0.45;
        dots.push(projected);
      }
      dots.sort((a, b) => a.z - b.z);
      for (const dot of dots) {
        const near = (dot.z + 1) / 2;
        const heat = live.heat * (dot.hot ? 1 : 0.3);
        ctx.fillStyle = `rgba(255, ${210 - heat * 80}, ${110 + heat * 70}, ${0.25 + near * 0.7})`;
        ctx.beginPath();
        ctx.arc(dot.x, dot.y, Math.max(0.4, dot.size), 0, Math.PI * 2);
        ctx.fill();
      }

      const glow = ctx.createRadialGradient(cx, cy, 0, cx, cy, unit * (0.28 + live.heat * 0.08));
      glow.addColorStop(0, "rgba(255, 246, 220, 0.95)");
      glow.addColorStop(0.2, `rgba(255, 196, 70, ${0.45 + live.heat * 0.35})`);
      glow.addColorStop(1, "rgba(255, 160, 20, 0)");
      ctx.fillStyle = glow;
      ctx.beginPath();
      ctx.arc(cx, cy, unit * 0.45, 0, Math.PI * 2);
      ctx.fill();

      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  </script>
</body>
</html>
